</head>
<body>
    <header>
        <nav>
            <input type="checkbox" id="toggle">
            <ul class="menu">
                <li class="fa fa-home"><a href="index.html">Home</a></li>
                <li class="fa fa-address-card"><a href="contact.html">Contact</a></li>
                <li class="fa fa-automobile"><a href="cars.html">Cars</a></li>
                <li class="fa fa-book"><a href="testimonials.html">Testimonials</a></li>
                <li class="fa fa-info"><a href="about.html">About Us</a></li>
            </ul>
        </nav>
    </header>
    <body>
        <div id="carList" class="featured-cars">

        </div>
        <script src="main.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", function (){
                listCars();
            });

            document.addEventListener("confirm-rental", (e) => {
                const dialogue = document.createElement("dialog");
                const confirm = document.createElement("button");
                const deny = document.createElement("button");

                confirm.addEventListener("click", () => {
                    console.log(e.detail);
                    dialogue.close();
                })

                deny.addEventListener("click", () => {
                    dialogue.close();
                })

                const name = document.createElement("p");
                const type = document.createElement("p");
                const pickupDate = document.createElement("p");
                const returnDate = document.createElement("p");

                name.textContent = e.detail.name;
                type.textContent = "Vehicle Type: " + e.detail.carType;
                pickupDate.textContent = "Pickup Date: " + e.detail.startDate;
                returnDate.textContent = "Return Date: " + e.detail.returnDate;

                dialogue.setAttribute("closedBy", "any")
                dialogue.textContent = "Confirm Selection";
                confirm.textContent = "Confirm.";
                deny.textContent = "Cancel.";

                dialogue.appendChild(name);
                dialogue.appendChild(type);
                dialogue.appendChild(pickupDate);
                dialogue.appendChild(returnDate);

                dialogue.appendChild(confirm);
                dialogue.appendChild(deny);
                document.body.appendChild(dialogue);
                dialogue.showModal();
            });
        </script>
    </body>
    <footer>
        <p>&copy; 2026</p>
    </footer>
</body>
